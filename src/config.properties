# ================================================================================
# ENTERPRISE SHOP MANAGEMENT SYSTEM - DATABASE CONFIGURATION
# ================================================================================
# This file controls database connection settings.
# The application automatically detects MySQL and falls back to SQLite if unavailable.
# ================================================================================

# Database Mode: AUTO (detect), MYSQL (force MySQL), SQLITE (force SQLite)
db.mode=AUTO

# ================================================================================
# MYSQL CONFIGURATION (Primary/Production Database)
# ================================================================================
db.mysql.host=localhost
db.mysql.port=3306
db.mysql.database=shop2
db.mysql.username=root
db.mysql.password=root

# MySQL Connection Settings
db.mysql.useSSL=false
db.mysql.serverTimezone=UTC
db.mysql.allowPublicKeyRetrieval=true

# Connection timeout for MySQL detection (milliseconds)
db.mysql.connection.timeout=3000

# ================================================================================
# SQLITE CONFIGURATION (Fallback/Local Database)
# ================================================================================
# SQLite database file location (relative to application directory)
db.sqlite.file=shop_local.db

# SQLite Connection Settings
db.sqlite.journal_mode=WAL
db.sqlite.synchronous=NORMAL
db.sqlite.foreign_keys=ON

# ================================================================================
# HIBERNATE SETTINGS (Common for both databases)
# ================================================================================
# Show SQL in console (true for debugging, false for production)
hibernate.show_sql=false

# Format SQL output
hibernate.format_sql=true

# Auto schema management: validate | update | create | create-drop
# MYSQL: use 'update' (schema managed manually or via migration)
# SQLITE: use 'update' (auto-create tables on first run)
hibernate.hbm2ddl.auto=update

# Connection pool size
hibernate.connection.pool_size=10

# ================================================================================
# SMTP EMAIL CONFIGURATION (For subscription notifications)
# ================================================================================
# Email system enabled
smtp.enabled=true

# SMTP Server Configuration
smtp.host=smtp.gmail.com
smtp.port=587
smtp.use_tls=true
smtp.use_ssl=false

# SMTP Authentication (Use App Password for Gmail, not regular password)
# IMPORTANT: For Gmail, generate an "App Password" at https://myaccount.google.com/apppasswords
smtp.username=your-email@gmail.com
smtp.password=your-app-password

# Email From Configuration
smtp.from_email=your-email@gmail.com
smtp.from_name=Shop Management System

# ================================================================================
# SUBSCRIPTION CONFIGURATION
# ================================================================================
# Enable/disable subscription enforcement
subscription.enabled=true

# Subscription duration (months)
subscription.duration_months=2

# Admin contact information (for locked app messages)
subscription.contact.name=Administrator
subscription.contact.phone=+92-XXX-XXXXXXX
subscription.contact.email=admin@shop.local

# ================================================================================
# ALTERNATIVE SMTP CONFIGURATIONS
# ================================================================================
# For Outlook/Microsoft 365:
#   smtp.host=smtp-mail.outlook.com
#   smtp.port=587
#   smtp.username=your-email@outlook.com
#   smtp.password=your-app-password
#
# For Office 365:
#   smtp.host=smtp.office365.com
#   smtp.port=587
#   smtp.username=your-email@company.com
#   smtp.password=your-password
#
# For Custom SMTP:
#   smtp.host=mail.yourdomain.com
#   smtp.port=587 or 25 or 465
#   smtp.username=your-username
#   smtp.password=your-password
# ================================================================================

# ================================================================================
# NOTES
# ================================================================================
# - If MySQL is not installed or not running, the app automatically uses SQLite
# - SQLite mode creates a local file-based database (no server required)
# - For production deployments, ensure MySQL is installed and configured
# - To force a specific database mode, set db.mode=MYSQL or db.mode=SQLITE
# - SMTP credentials should be configured for email notifications to work
# - Gmail users: use "App Passwords", not your regular Gmail password
# - Email queuing works offline - queued emails send when internet returns
# ================================================================================
