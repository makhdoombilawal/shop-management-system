# ============================================================================
# APPLICATION CONFIGURATION
# Shop Management System - Enterprise Edition
# ============================================================================

# Application Information
app.name=Shop Management System
app.version=2.0
app.env=production

# MySQL Database Configuration (Will be overridden by installer)
mysql.host=127.0.0.1
mysql.port=3306
mysql.database=shop2
mysql.username=root
# Password configured by installer

# Application Settings
app.firstrun=true
app.auto_backup=true
app.backup_interval_days=7
app.max_login_attempts=5
app.session_timeout_minutes=60

# Barcode Configuration
barcode.scanner.enabled=true
barcode.scanner.type=USB
barcode.format=EAN13
barcode.storage_path=./barcodes

# UI Settings
ui.theme=modern
ui.language=en
ui.date_format=yyyy-MM-dd
ui.time_format=HH:mm:ss
ui.currency=PKR

# Logging Configuration
logging.level=INFO
logging.file=./logs/shop_manager.log
logging.max_size_mb=10
logging.max_history_days=30

# Security Settings
security.password_min_length=6
security.password_require_special=false
security.session_encryption=true

# Report Settings
report.export_format=PDF
report.logo_path=./resources/images/logo.png

# Notification Settings
notifications.low_stock_alert=true
notifications.low_stock_threshold=10
notifications.daily_summary=true

# System Settings
system.auto_update=false
system.telemetry=false
system.crash_reporting=false
