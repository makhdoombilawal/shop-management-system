# Shop Management System - Production Configuration
# This file stores externalized configuration (DO NOT COMMIT TO GIT)
# Created by application on first run

# ============================================================================
# DATABASE CONFIGURATION
# ============================================================================

# Database Type: MYSQL or SQLITE
# MYSQL - Production database server (if MySQL installed locally)
# SQLITE - Embedded database (fallback, works everywhere)
db.type=AUTO

# MySQL Configuration (only used if db.type=MYSQL)
db.mysql.host=127.0.0.1
db.mysql.port=3306
db.mysql.database=shop2
db.mysql.username=root
db.mysql.password=root

# SQLite Configuration (fallback)
# Location: Application root directory
db.sqlite.filename=shop.db

# ============================================================================
# HIBERNATE CONFIGURATION
# ============================================================================

# Auto schema update
hibernate.hbm2ddl.auto=update

# Show SQL in console (set to false in production)
hibernate.show_sql=false

# Query timeout (seconds)
hibernate.query.timeout=30

# ============================================================================
# APPLICATION CONFIGURATION
# ============================================================================

# Application Name
app.name=Shop Management System
app.version=2.0.0

# UI Theme
ui.theme=FlatLaf

# First run setup
app.first_run_setup=true

# ============================================================================
# SECURITY CONFIGURATION
# ============================================================================

# Password hashing algorithm
security.password.algorithm=BCRYPT

# Login attempts before lockout
security.login.max_attempts=5

# Session timeout (minutes)
security.session.timeout=30

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================

# Log Level: DEBUG, INFO, WARN, ERROR
logging.level=INFO

# Log file path
logging.file.path=logs/application.log

# Maximum log file size
logging.file.max_size=10MB

# ============================================================================
# FEATURES CONFIGURATION
# ============================================================================

# Enable barcode scanning
feature.barcode.enabled=true

# Enable POS system
feature.pos.enabled=true

# Enable reporting
feature.reporting.enabled=true

# Enable audit logging
feature.audit.enabled=true

# ============================================================================
# PERFORMANCE TUNING
# ============================================================================

# Database connection pool size
db.pool.size=10

# Cache size
cache.size=1000

# Query cache enabled
query.cache.enabled=true

# ============================================================================
# NOTES
# ============================================================================
# Keep this file secure - contains database credentials
# Never commit to version control
# Back up regularly
